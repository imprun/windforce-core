name: image

on:
  pull_request:
    paths:
      - .github/workflows/image.yml
      - Dockerfile
      - go.mod
      - go.sum
      - '**/*.go'
      - web/**
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Classify release tag
        id: release
        shell: bash
        run: |
          publish=false
          if [[ "${GITHUB_EVENT_NAME}" == "push" \
            && "${GITHUB_REF_TYPE}" == "tag" \
            && "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            publish=true
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - name: Install Web UI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify embedded Web UI
        run: make web-embed-verify
      - name: Build and smoke
        run: make build-smoke
      - name: Test
        run: make test
      - name: Check reachable vulnerabilities
        run: make security

  build:
    needs: validate
    if: github.event_name == 'pull_request' || needs.validate.outputs.publish == 'true'
    name: ${{ matrix.image.name }} / ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: standard
            target: runtime
            repository: ghcr.io/imprun/windforce-core
          - name: ocr
            target: runtime-ocr
            repository: ghcr.io/imprun/windforce-core-ocr
        platform:
          - arch: amd64
            value: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            value: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: needs.validate.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build pull request image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.value }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: windforce-core-test:${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=min,ignore-error=true,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Smoke-test pull request image
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          LOCAL_IMAGE: windforce-core-test:${{ matrix.image.name }}-${{ matrix.platform.arch }}
        run: docker run --rm "${LOCAL_IMAGE}" version
      - name: Build and publish release image by digest
        if: needs.validate.outputs.publish == 'true'
        id: release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.platform.value }}
          outputs: type=image,name=${{ matrix.image.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # Tag-scoped GHA cache exports accumulate once per release. A release may
          # restore an accessible cache, but it must not create another tag cache.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
      - name: Export release digest
        if: needs.validate.outputs.publish == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          digest="${DIGEST#sha256:}"
          test "${#digest}" -eq 64
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${digest}"
      - name: Upload release digest
        if: needs.validate.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    name: publish / ${{ matrix.image.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: standard
            repository: ghcr.io/imprun/windforce-core
          - name: ocr
            repository: ghcr.io/imprun/windforce-core-ocr
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: digests-${{ matrix.image.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Create multi-architecture image
        id: manifest
        shell: bash
        env:
          IMAGE: ${{ matrix.image.repository }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected exactly two platform digests, found ${#digests[@]}" >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE}@sha256:${digest}")
          done
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            "${sources[@]}"
          reference="${IMAGE}:${GITHUB_REF_NAME}"
          digest="$(docker buildx imagetools inspect "${reference}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "${digest#sha256:}" != "${digest}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify image platforms
        shell: bash
        env:
          REFERENCE: ${{ steps.manifest.outputs.reference }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REFERENCE}"
          docker buildx imagetools inspect "${REFERENCE}" --raw \
            | jq -e '[.manifests[] | select(.platform.os == "linux") | select(.platform.architecture == "amd64" or .platform.architecture == "arm64") | .platform.architecture] | unique | sort == ["amd64", "arm64"]'
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
          install-dir: ${{ runner.temp }}/cosign
      - name: Sign and verify immutable image
        shell: bash
        env:
          IMAGE: ${{ matrix.image.repository }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          issuer="https://token.actions.githubusercontent.com"
          immutable="${IMAGE}@${DIGEST}"
          cosign sign --yes "${immutable}"
          cosign verify \
            --certificate-identity="${identity}" \
            --certificate-oidc-issuer="${issuer}" \
            "${immutable}"
      - name: Record published image
        shell: bash
        env:
          REFERENCE: ${{ steps.manifest.outputs.reference }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### Published ${REFERENCE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "SBOM, provenance, and a verified keyless Cosign signature are attached."
          } >> "${GITHUB_STEP_SUMMARY}"
