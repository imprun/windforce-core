name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: windforce_core
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d windforce_core"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install Web UI dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify embedded Web UI
        run: make web-embed-verify
      - name: Verify formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Build and smoke
        run: make build-smoke
      - name: Test
        run: make test
      - name: Check reachable vulnerabilities
        run: make security
      - name: Test PostgreSQL storage
        env:
          WINDFORCE_CORE_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/windforce_core?sslmode=disable
        run: go test ./internal/state -run Postgres -count=1 -v
      - name: Test RabbitMQ trigger
        env:
          WINDFORCE_RABBITMQ_TEST_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go test ./internal/trigger -run RabbitMQIntegration -count=1 -v

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Make
        run: choco install make --no-progress --yes
      - name: Build and smoke through Makefile
        run: make build-smoke

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and smoke
        run: |
          go build -trimpath -o "${RUNNER_TEMP}/windforce-core" ./cmd/windforce-core
          "${RUNNER_TEMP}/windforce-core" version

  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Verify snapshot archives
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 6
          sha256sum --check checksums.txt
          expected="$(printf '%s\n' LICENSE README.md windforce-core | LC_ALL=C sort)"
          expected_windows="$(printf '%s\n' LICENSE README.md windforce-core.exe | LC_ALL=C sort)"
          for archive in windforce-core_*.tar.gz; do
            test "$(tar -tzf "${archive}" | LC_ALL=C sort)" = "${expected}"
          done
          for archive in windforce-core_*.zip; do
            test "$(unzip -Z1 "${archive}" | LC_ALL=C sort)" = "${expected_windows}"
          done
          archive="$(find . -maxdepth 1 -type f -name 'windforce-core_*_linux_amd64.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir -p "${RUNNER_TEMP}/windforce-core-smoke"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/windforce-core-smoke"
          "${RUNNER_TEMP}/windforce-core-smoke/windforce-core" version
