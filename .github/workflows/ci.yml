name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: windforce_core
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d windforce_core"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Verify formatting
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Test PostgreSQL storage
        env:
          WINDFORCE_LITE_POSTGRES_TEST_DSN: postgres://postgres@127.0.0.1:5432/windforce_core?sslmode=disable
        run: go test ./internal/state -run Postgres -count=1 -v
      - name: Test RabbitMQ trigger
        env:
          WINDFORCE_RABBITMQ_TEST_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go test ./internal/trigger -run RabbitMQIntegration -count=1 -v

  windows-cli:
    name: windows CLI
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        run: go build -trimpath -o "${{ runner.temp }}/windforce.exe" ./cmd/windforce
      - name: Build server
        run: go build -trimpath -o "${{ runner.temp }}/windforce-core.exe" ./cmd/windforce-core
      - name: Test CLI contracts
        run: go test ./internal/controlcli ./pkg/controlplane

  release-snapshot:
    name: release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Verify snapshot archives
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 6
          archive="$(find dist -maxdepth 1 -type f -name '*_linux_amd64.tar.gz' -print -quit)"
          test -n "${archive}"
          mkdir -p "${RUNNER_TEMP}/windforce-smoke"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/windforce-smoke"
          "${RUNNER_TEMP}/windforce-smoke/windforce" version
