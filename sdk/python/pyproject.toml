[project]
name = "windforce-invocation"
version = "0.3.0"
description = "Python client for the Windforce Invocation API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Windforce Core contributors" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windforce_invocation"]
